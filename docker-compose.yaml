services:
  postgres:
    platform: linux/amd64
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: decode
      POSTGRES_USER: decode_user
      POSTGRES_PASSWORD: decode_password
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./infra/postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U decode_user -d decode" ]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    platform: linux/amd64
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./infra/qdrant_storage:/qdrant/storage
    restart: always

  minio:
    platform: linux/amd64
    image: quay.io/minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./infra/minio_data:/data
    command: server /data --console-address ":9001"
    restart: always

  ingestion-engine:
    platform: linux/amd64
    build: ./ingestion-engine
    extra_hosts: [ "host.docker.internal:host-gateway" ]
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      - SCAN_ROOT=/workspace
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/decode
      - SPRING_DATASOURCE_USERNAME=decode_user
      - SPRING_DATASOURCE_PASSWORD=decode_password
    volumes:
      - ./:/workspace

  code-parser:
    platform: linux/amd64
    build: ./code-parser
    extra_hosts: [ "host.docker.internal:host-gateway" ]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      - SCAN_ROOT=/workspace
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/decode
      - SPRING_DATASOURCE_USERNAME=decode_user
      - SPRING_DATASOURCE_PASSWORD=decode_password
    volumes:
      - ./:/workspace

  vectorizer-service:
    platform: linux/amd64
    build: ./vectorizer-service
    extra_hosts: [ "host.docker.internal:host-gateway" ]
    ports:
      - "8084:8080"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      - SCAN_ROOT=/workspace
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/decode
      - SPRING_DATASOURCE_USERNAME=decode_user
      - SPRING_DATASOURCE_PASSWORD=decode_password
      - QDRANT_HOST=qdrant
      - JAVA_TOOL_OPTIONS=-Djava.net.preferIPv4Stack=true -Ddjl.default_engine=OnnxRuntime
      - SPRING_CONFIG_LOCATION=classpath:/application.yaml
    volumes:
      - ./infra/models:/models

  llm-gateway-service:
    platform: linux/amd64
    build: ./llm-gateway-service
    extra_hosts: [ "host.docker.internal:host-gateway" ]
    ports:
      - "8085:8080"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      - JAVA_TOOL_OPTIONS=-Djava.net.preferIPv4Stack=true -Ddjl.default_engine=OnnxRuntime
      - SPRING_CONFIG_LOCATION=classpath:/application.yaml
    env_file: .env.local

  context-orchestrator:
    platform: linux/amd64
    build: ./context-orchestrator
    extra_hosts: [ "host.docker.internal:host-gateway" ]
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      llm-gateway-service:
        condition: service_started
      qdrant:
        condition: service_started
    environment:
      - SCAN_ROOT=/workspace
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/decode
      - SPRING_DATASOURCE_USERNAME=decode_user
      - SPRING_DATASOURCE_PASSWORD=decode_password
      - JAVA_TOOL_OPTIONS=-Djava.net.preferIPv4Stack=true -Ddjl.default_engine=OnnxRuntime -Ddjl.onnxruntime.num_threads=1
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - SPRING_CONFIG_LOCATION=classpath:/application.yaml
    volumes:
      - ./infra/models:/models
