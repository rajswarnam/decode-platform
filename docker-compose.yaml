version: '3.8'
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./infra/qdrant_storage:/qdrant/storage
    restart: always

  minio:
    image: quay.io/minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./infra/minio_data:/data
    command: server /data --console-address ":9001"
    restart: always

  ingestion-engine:
    build: ./ingestion-engine
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports:
      - "8083:8080"
    environment:
      - SCAN_ROOT=/workspace
      - SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/decode
    volumes:
      - ./:/workspace

  code-parser:
    build: ./code-parser
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      - SCAN_ROOT=/workspace
      - SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/decode
    volumes:
      - ./:/workspace

  vectorizer-service:
    build: ./vectorizer-service
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      - SCAN_ROOT=/workspace
      - SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/decode
      - QDRANT_HOST=host.docker.internal
      - JAVA_TOOL_OPTIONS=-Djava.net.preferIPv4Stack=true
    volumes:
      - ./infra/models:/models

  llm-gateway-service:
    build: ./llm-gateway-service
    ports: ["8081:8081"]
    env_file: .env
    environment:
       - AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY}
       - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
       - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT}

  context-orchestrator:
    build: ./context-orchestrator
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports:
      - "8082:8080"
    depends_on:
      - llm-gateway-service
    environment:
      - SCAN_ROOT=/workspace
      - SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/decode
    volumes:
      - ./infra/models:/models