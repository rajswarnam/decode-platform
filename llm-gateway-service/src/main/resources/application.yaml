server:
  port: 8081

spring:
  application:
    name: llm-gateway-service
  autoconfigure:
    exclude:
      # Exclude Spring AI Azure OpenAI auto-configuration
      # We use InternalLlmClientService with RestTemplate instead
      - org.springframework.ai.autoconfigure.azure.openai.AzureOpenAiAutoConfiguration
      - org.springframework.ai.autoconfigure.azure.openai.AzureOpenAiChatAutoConfiguration

# LLM Gateway Rate Limiting Configuration
llm:
  governor:
    tpm-limit: 250000  # 250k tokens per minute (user quota)
    rpm-limit: 3000    # 3000 requests per minute (50 req/sec max)
    min-request-delay-ms: 200  # Minimum 200ms between requests
  retry:
    max-attempts: 3      # Max retry attempts for 429 errors
    initial-delay-ms: 3000  # Initial delay for 429 retry (exponential backoff: 3s, 6s, 12s)
azure:
  ad:
    tenant-id: ${AZURE_AD_TENANT_ID}
    client-id: ${AZURE_AD_CLIENT_ID}
    client-secret: ${AZURE_AD_CLIENT_SECRET}
    scope: https://genaigateway-dev.usbank.com/.default  # Default scope, adjust if needed

# Internal LLM Gateway
internal:
  llm:
    gateway:
      base-url: ${INTERNAL_LLM_GATEWAY_BASE_URL}  # e.g., https://internal-gateway.company.com/v1
      model: ${INTERNAL_LLM_MODEL:gpt-4o}  # Default model name
      query-params: ${INTERNAL_LLM_GATEWAY_QUERY_PARAMS:?api-version=2023-12-01-preview}
    embeddings:
      base-url: ${INTERNAL_EMBEDDINGS_BASE_URL}