server:
  port: 8081

spring:
  application:
    name: llm-gateway-service
  ai:
    azure:
      openai:
        api-key: ${AZURE_OPENAI_KEY}
        endpoint: ${AZURE_OPENAI_ENDPOINT}
        deployment-name: ${AZURE_OPENAI_DEPLOYMENT} # Global
        chat:
          options:
            deployment-name: ${AZURE_OPENAI_DEPLOYMENT} # Chat Specific
            temperature: 0.7
