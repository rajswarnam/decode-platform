spring:
  application:
    name: vectorizer-service
  datasource:
    url: jdbc:postgresql://postgres:5432/decode
    username: ${SPRING_DATASOURCE_USERNAME:decode_user}
    password: ${SPRING_DATASOURCE_PASSWORD:decode_password} 
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update # To map entities, usually 'validate' or 'none' if schema exists. 'update' is safe for dev.
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  ai:
    vectorstore:
      qdrant:
        host: qdrant
        port: 6334
        collection-name: symbols
        initialize-schema: true
        check-compatibility: false
    transformers:
      onnx:
        # Point to files mounted from infra/models to /models in container
        model-uri: file:/models/model.onnx
        tokenizer-uri: file:/models/tokenizer.json
        enabled: true
    model:
      embedding: transformers
          
minio:
  endpoint: http://minio:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: decode-source-code

# Vectorizer configuration
vectorizer:
  # Auto-vectorize all symbols on startup (default: false)
  # Set to true if you want vectorization to run automatically on every startup
  # Recommended: false - symbols will be vectorized when triggered by code-parser or via API
  auto-vectorize-on-startup: false
