spring:
  application:
    name: code-parser
  datasource:
    url: jdbc:postgresql://postgres:5432/decode
    username: ${SPRING_DATASOURCE_USERNAME:decode_user}
    password: ${SPRING_DATASOURCE_PASSWORD:decode_password} 
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  ai:
    openai:
      api-key: dummy-key-for-gateway
      base-url: http://llm-gateway-service:8081
      chat:
        options:
          model: gpt-3.5-turbo

minio:
  endpoint: http://minio:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: decode-source-code

# Parser configuration
parser:
  # Auto-parse all projects on startup (default: false)
  # Set to true if you want parsing to run automatically on every startup
  # Recommended: false - projects will be parsed during ingestion or via API
  auto-parse-on-startup: false

# LLM Gateway configuration
# Uses llm-gateway-service which calls the internal gateway with proper authentication
llm:
  gateway:
    url: ${LLM_GATEWAY_URL:http://llm-gateway-service:8081}
    model: ${LLM_GATEWAY_MODEL:gpt-4o}
