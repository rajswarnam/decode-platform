spring:
  application:
    name: context-orchestrator
  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.chat.client.observation.ChatClientObservationAutoConfiguration
      - org.springframework.ai.autoconfigure.vectorstore.qdrant.QdrantVectorStoreAutoConfiguration
  datasource:
    url: jdbc:postgresql://postgres:5432/decode
    username: ${SPRING_DATASOURCE_USERNAME:decode_user}
    password: ${SPRING_DATASOURCE_PASSWORD:decode_password} 
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  ai:
    openai:
      api-key: dummy-key-for-gateway
      base-url: http://llm-gateway-service:8081
      chat:
        enabled: true
        options:
          model: gpt-4o
      client:
        observation:
          enabled: false
      embedding:
        enabled: false # Disable OpenAI embeddings - use local ONNX embeddings instead
    embedding:
      transformer:
        enabled: true # Enable local ONNX embeddings for query embedding
        onnx:
          # Use local models mounted at /models in Docker container
          # Models are in infra/models/ directory and mounted via docker-compose
          model-uri: file:/models/model.onnx
          tokenizer-uri: file:/models/tokenizer.json
    vectorstore:
      qdrant:
        host: qdrant
        port: 6334
        collection-name: symbols
        initialize-schema: false
  http:
    client:
      # Increased timeouts to handle rate limit pauses (up to 95s) + LLM call time
      # Rate limit pause can be up to 60s (full window reset), plus LLM calls can take 30-60s
      # Total: 60s pause + 60s LLM call = 120s minimum, but we need buffer for multiple calls
      read-timeout: 600s  # 10 minutes - handles rate limit pauses + multiple LLM calls
      connect-timeout: 60s

minio:
  endpoint: http://host.docker.internal:9000
  accessKey: minioadmin
  secretKey: minioadmin
  bucket: decode-source-code

# Dictionary configuration
dictionary:
  # Auto-populate dictionary on startup (default: false)
  # Set to true if you want dictionary to run automatically on every startup
  # Recommended: false - trigger dictionary population during ingestion instead
  auto-populate-on-startup: false
