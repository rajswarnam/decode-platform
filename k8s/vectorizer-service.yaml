apiVersion: apps/v1
kind: Deployment
metadata:
  name: vectorizer-service
  namespace: decode-app
  labels:
    app: vectorizer-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vectorizer-service
  template:
    metadata:
      labels:
        app: vectorizer-service
    spec:
      containers:
      - name: vectorizer-service
        image: vectorizer-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: vectorizer-service
  namespace: decode-app
spec:
  selector:
    app: vectorizer-service
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
